<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152c">
<title>ZAYN AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(160deg,#10294b,#050b19);
 color:white;font-family:Arial,sans-serif;
 min-height:100vh;text-align:center;padding:25px 18px
}
h1{font-size:38px;letter-spacing:7px;margin-top:35px}
.sub{color:#9db5d5}
.orb{
 width:190px;height:190px;border-radius:50%;
 border:2px solid #258edc;margin:35px auto;
 display:grid;place-items:center;
 box-shadow:0 0 45px #087bd9
}
.star{font-size:65px;color:#80dfff}
button{
 border:0;border-radius:35px;padding:17px 25px;
 background:linear-gradient(90deg,#0878df,#20b9e8);
 color:white;font-size:17px;font-weight:bold;
 margin:10px;cursor:pointer
}
#status{color:#80dfff;min-height:25px}
#answer{
 background:#142743;border:1px solid #29466b;
 padding:18px;border-radius:18px;min-height:65px;
 margin:20px 0;line-height:1.6
}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
 background:#14243d;border:1px solid #29415e;
 padding:20px 10px;border-radius:18px
}
.card b{display:block;margin:10px}
small{color:#9db5d5}
</style>
</head>
<body>
<div style="color:#70d8ff;letter-spacing:3px">
PERSONAL AI ASSISTANT
</div>
<h1>ZAYN</h1>
<div class="sub">Сизнинг шахсий ақлли ёрдамчингиз</div>
<div class="orb"><div class="star">✦</div></div>

<button onclick="listen()">🎙 Овозли суҳбат</button>
<div id="status">ZAYN сизni эшитишга тайёр</div>
<div id="answer">Ассалому алайкум! Мен ZAYN. Сизни эшитишга тайёрман.</div>

<div class="cards">
<div class="card">⏰<b>Кун тартиби</b><small>06:00 уйғониш<br>22:00 уйқу</small></div>
<div class="card">🕌<b>Намоз вақтлари</b><small>Кейинги босқичда уланади</small></div>
<div class="card">📖<b>Қуръон ёдлаш</b><small>Фотиҳа сурасидан бошлаш</small></div>
<div class="card">🔤<b>Арабча сўзлар</b><small>Янги сўзлар ва такрорлаш</small></div>
</div>

<script>
const statusBox=document.getElementById("status");
const answerBox=document.getElementById("answer");

function speak(text){
 if(!window.speechSynthesis){
  statusBox.textContent="Овоз чиқариш браузерда мавжуд эмас";
  return;
 }
 speechSynthesis.cancel();
 let msg=new SpeechSynthesisUtterance(text);
 msg.lang="uz-UZ";
 msg.rate=0.9;
 msg.pitch=0.8;
 speechSynthesis.speak(msg);
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  statusBox.textContent="Овозни таниш Chrome'да қўллаб-қувватланмаяпти";
  return;
 }
 const rec=new SR();
 rec.lang="uz-UZ";
 rec.interimResults=false;
 rec.onstart=()=>statusBox.textContent="🎙 Сизни эшитяпман...";
 rec.onresult=(e)=>{
  const words=e.results[0][0].transcript;
  answerBox.textContent="Сиз: "+words;
  const reply="Сизни эшитдим. "+words+". Мен ZAYN, овозли синов режимидаман.";
  answerBox.textContent+="\nZAYN: "+reply;
  speak(reply);
 };
 rec.onerror=(e)=>statusBox.textContent="Микрофон хатоси: "+e.error;
 rec.onend=()=>statusBox.textContent="Суҳбат тугади. Яна гаплашиш учун босинг.";
 rec.start();
}
</script>
</body>
</html>
