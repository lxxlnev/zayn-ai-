<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07121f">
<title>ZAYN AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#102d4b,#050912 75%);
 color:#eaf4ff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
.app{
 max-width:850px;
 margin:auto;
 min-height:100vh;
 display:flex;
 flex-direction:column;
 padding:20px;
}
header{
 text-align:center;
 padding:30px 10px 20px;
}
.logo{
 width:90px;height:90px;
 border-radius:50%;
 margin:auto;
 display:grid;
 place-items:center;
 font-size:35px;
 font-weight:bold;
 color:#67e8ff;
 border:2px solid #35bfff;
 box-shadow:0 0 30px #00aaff55;
 background:#071a2d;
}
h1{letter-spacing:7px;margin:18px 0 5px}
.subtitle{color:#8daac4}
.status{
 display:inline-block;
 margin-top:12px;
 padding:7px 14px;
 border:1px solid #254c68;
 border-radius:30px;
 color:#68e5ff;
 font-size:12px;
}
.chat{
 flex:1;
 min-height:300px;
 border:1px solid #19364f;
 background:#07111dcc;
 border-radius:20px;
 padding:16px;
 overflow-y:auto;
}
.msg{
 max-width:85%;
 padding:13px 16px;
 border-radius:16px;
 margin:12px 0;
 white-space:pre-wrap;
 line-height:1.5;
}
.bot{
 background:#102a43;
 border:1px solid #1d5278;
}
.user{
 background:#075b85;
 margin-left:auto;
}
.inputbox{
 display:flex;
 gap:10px;
 margin-top:15px;
}
input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:15px;
 border:1px solid #24506c;
 background:#0b1a2b;
 color:white;
 outline:none;
}
button{
 border:0;
 border-radius:14px;
 padding:14px 18px;
 color:white;
 background:linear-gradient(135deg,#087fbd,#164fc0);
 cursor:pointer;
 font-weight:bold;
}
button:disabled{opacity:.5}
.mic{background:#173752}
.footer{
 text-align:center;
 color:#59748d;
 font-size:12px;
 padding:20px;
}
</style>
</head>

<body>
<div class="app">

<header>
<div class="logo">Z</div>
<h1>ZAYN AI</h1>
<div class="subtitle">Ваш персональный ИИ-помощник</div>
<div class="status" id="status">STANDARD · ГОТОВ</div>
</header>

<div class="chat" id="chat">
<div class="msg bot">
Здравствуйте! Я ZAYN — ваш персональный ИИ-помощник.
Чем могу помочь?
</div>
</div>

<div class="inputbox">
<input id="input" placeholder="Напишите сообщение..." autocomplete="off">
<button id="send">➤</button>
<button class="mic" id="mic">🎙</button>
</div>

<div class="footer">ZAYN AI · Personal Assistant</div>
</div>

<script>
const API_URL = "https://odd-dew-8904zayn-ai-backend.uawiraxunovv.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const statusBox = document.getElementById("status");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ru-RU";
 utterance.rate=1;
 utterance.pitch=0.85;
 speechSynthesis.speak(utterance);
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;

 addMessage(message,"user");
 input.value="";
 send.disabled=true;
 statusBox.textContent="ZAYN · ДУМАЕТ...";

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Ошибка сервера");
  }

  const answer=data.answer || data.response || "Нет ответа";
  addMessage(answer,"bot");
  statusBox.textContent=(data.mode||"STANDARD")+" · ГОТОВ";
  speak(answer);

 }catch(error){
  addMessage("Не удалось подключиться. Проверьте интернет и сервер Cloudflare.\n"+error.message,"bot");
  statusBox.textContent="ОШИБКА СВЯЗИ";
 }finally{
  send.disabled=false;
  input.focus();
 }
send.onklick=sendMessage;
 input.addEventListener("keydown", e
  => 
    if (e.key === "Enter")
      sendMessage();
});
</script>
</body>
</html>
